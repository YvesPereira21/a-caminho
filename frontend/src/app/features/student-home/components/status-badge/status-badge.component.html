<span
  class="status-badge inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border transition-colors shadow-2xs"
  [ngClass]="badgeClasses()"
>
  <span
    class="w-1.5 h-1.5 rounded-full"
    [ngClass]="dotClasses()"
    [class.animate-pulse]="pulse()"
  ></span>
  <span>{{ text() }}</span>
</span>
