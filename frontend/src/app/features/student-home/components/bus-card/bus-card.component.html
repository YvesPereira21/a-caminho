<div
  (click)="onCardClick()"
  (keyup.enter)="onCardClick()"
  tabindex="0"
  role="button"
  class="bus-card-container group relative p-4 rounded-xl border transition-all duration-200 cursor-pointer text-left select-none outline-none focus-visible:ring-2 focus-visible:ring-emerald-600 focus-visible:ring-offset-2"
  [ngClass]="isSelected()
    ? 'bg-emerald-50/50 border-emerald-500 shadow-sm ring-1 ring-emerald-500'
    : 'bg-white border-slate-200 hover:border-slate-300 hover:shadow-xs'"
>
  <div class="flex items-start justify-between gap-3 mb-2.5">
    <div class="flex items-center gap-2.5 min-w-0">
      <div
        class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0 transition-colors"
        [ngClass]="isSelected() ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-700 group-hover:bg-emerald-50 group-hover:text-emerald-700'"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 6v6" />
          <path d="M15 6v6" />
          <path d="M2 12h19.6" />
          <path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.6-.5-1-1-1H3c-.5 0-1 .4-1 1 0 .4.1.8.2 1.2.3 1.1.8 2.8.8 2.8h3" />
          <circle cx="7" cy="18" r="2" />
          <path d="M9 18h5" />
          <circle cx="16" cy="18" r="2" />
        </svg>
      </div>

      <div class="min-w-0">
        <h3 class="text-sm font-semibold text-slate-800 truncate leading-tight">
          {{ item().routeName }}
        </h3>
        <p class="text-xs text-slate-500 truncate mt-0.5">
          Data: {{ item().pollDate }}
        </p>
      </div>
    </div>

    <app-status-badge
      [text]="item().shift"
      variant="active"
    ></app-status-badge>
  </div>

  <div class="pt-2 border-t border-slate-100 grid grid-cols-2 gap-2 text-xs">
    <div class="flex items-center gap-1.5 text-slate-500 truncate">
      <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span class="truncate">Horário: <strong class="font-medium text-slate-700">{{ item().startTime }}</strong></span>
    </div>

    <div class="flex items-center justify-end gap-1.5 text-slate-600">
      <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
      <span>
        Confirmados: <strong class="font-semibold text-emerald-700">{{ item().confirmedVotes }}</strong>
      </span>
    </div>
  </div>
</div>
