<!-- Sidebar Fixa Desktop (170-180px) em Verde-Escuro #003B35 -->
<aside class="sidebar-desktop hidden lg:flex flex-col justify-between w-[175px] shrink-0 bg-[#003B35] text-white py-6 px-3 shadow-md z-30">
  <div class="flex flex-col gap-8">
    <!-- Logo A caminho! -->
    <div class="flex items-center gap-2.5 px-2">
      <div class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center text-white border border-white/20">
        <svg class="w-5 h-5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 6v6" />
          <path d="M15 6v6" />
          <path d="M2 12h19.6" />
          <path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.6-.5-1-1-1H3c-.5 0-1 .4-1 1 0 .4.1.8.2 1.2.3 1.1.8 2.8.8 2.8h3" />
          <circle cx="7" cy="18" r="2" />
          <path d="M9 18h5" />
          <circle cx="16" cy="18" r="2" />
        </svg>
      </div>
      <span class="text-base font-bold tracking-tight text-white">A caminho!</span>
    </div>

    <!-- Links de Navegação -->
    <nav class="flex flex-col gap-1.5" aria-label="Navegação Principal">
      <a
        routerLink="/student"
        class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all duration-150 w-full text-left cursor-pointer"
        [ngClass]="activeTab() === 'inicio' ? 'bg-[#16A34A] text-white shadow-xs' : 'text-emerald-100/80 hover:bg-white/10 hover:text-white'"
      >
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        <span>Início</span>
      </a>

      <a
        routerLink="/student"
        class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all duration-150 w-full text-left cursor-pointer"
        [ngClass]="activeTab() === 'rotas' ? 'bg-[#16A34A] text-white shadow-xs' : 'text-emerald-100/80 hover:bg-white/10 hover:text-white'"
      >
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
        </svg>
        <span>Rotas</span>
      </a>

      <a
        routerLink="/student"
        class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all duration-150 w-full text-left cursor-pointer"
        [ngClass]="activeTab() === 'onibus' ? 'bg-[#16A34A] text-white shadow-xs' : 'text-emerald-100/80 hover:bg-white/10 hover:text-white'"
      >
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 6v6" />
          <path d="M15 6v6" />
          <path d="M2 12h19.6" />
          <path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.6-.5-1-1-1H3c-.5 0-1 .4-1 1 0 .4.1.8.2 1.2.3 1.1.8 2.8.8 2.8h3" />
          <circle cx="7" cy="18" r="2" />
          <path d="M9 18h5" />
          <circle cx="16" cy="18" r="2" />
        </svg>
        <span>Ônibus</span>
      </a>

      <a
        routerLink="/student/polls"
        class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all duration-150 w-full text-left cursor-pointer"
        [ngClass]="activeTab() === 'enquetes' ? 'bg-[#16A34A] text-white shadow-xs' : 'text-emerald-100/80 hover:bg-white/10 hover:text-white'"
      >
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
        </svg>
        <span>Enquetes</span>
      </a>

      <a
        routerLink="/student"
        class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all duration-150 w-full text-left cursor-pointer"
        [ngClass]="activeTab() === 'perfil' ? 'bg-[#16A34A] text-white shadow-xs' : 'text-emerald-100/80 hover:bg-white/10 hover:text-white'"
      >
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        <span>Meu Perfil</span>
      </a>
    </nav>
  </div>

  <!-- Botão de Sair inferior -->
  <div class="pt-4 border-t border-white/15">
    <button
      type="button"
      (click)="logout()"
      class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-medium text-emerald-200/80 hover:bg-white/10 hover:text-rose-200 transition-colors w-full text-left cursor-pointer"
    >
      <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      <span>Sair</span>
    </button>
  </div>
</aside>
